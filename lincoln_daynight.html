<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lincoln Memorial - Realistic Textures and Day/Night Lighting</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ececf0;
        }

        .toolbar {
            padding: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .note {
            margin-left: 8px;
            color: #444;
            font-size: 14px;
        }

        .sliderGroup {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: 8px;
            font-size: 14px;
        }

        #TimeSlider {
            width: 220px;
        }

        canvas {
            display: block;
            width: 100vw;
            height: calc(100vh - 55px);
            background: white;
            border: none;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="ToggleSim">Play 24 Hour Light</button>
        <button id="LockCamera">Lock Fixed Camera</button>
        <button id="OnePointCamera">One-Point Perspective</button>
        <span id="orbitNote" class="note" style="display:none;">Drag mouse to orbit up and down, scroll to zoom</span>
    </div>

    <canvas id="gl-canvas"></canvas>

    <script id="vertex-shader" type="x-shader/x-vertex">
    #version 300 es

    in vec4 aPosition;
    in vec3 aNormal;
    in vec2 aTexCoord;
    in float aMaterial;

    out vec3 vEyePos;
    out vec3 vEyeNormal;
    out vec3 vObjPos;
    out vec3 vObjNormal;
    out vec2 vTexCoord;
    out float vMaterial;

    uniform mat4 uModelViewMatrix;
    uniform mat4 uProjectionMatrix;

    void main() {
        vec4 eyePos = uModelViewMatrix * aPosition;

        vEyePos = eyePos.xyz;
        vEyeNormal = normalize((uModelViewMatrix * vec4(aNormal, 0.0)).xyz);
        vObjPos = aPosition.xyz;
        vObjNormal = normalize(aNormal);
        vTexCoord = aTexCoord;
        vMaterial = aMaterial;

        gl_Position = uProjectionMatrix * eyePos;
    }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
    #version 300 es
    precision highp float;

    in vec3 vEyePos;
    in vec3 vEyeNormal;
    in vec3 vObjPos;
    in vec3 vObjNormal;
    in vec2 vTexCoord;
    in float vMaterial;

    out vec4 fColor;

    uniform vec4 uAmbientProduct;
    uniform vec4 uDiffuseProduct;
    uniform vec4 uSpecularProduct;
    uniform vec4 uLightPosition;
    uniform float uShininess;
    uniform float uReflectionLength;
    uniform float uReflectionOpacity;
    uniform float uWaterHighlight;
    uniform vec4 uWaterHighlightColor;
    uniform vec2 uShadowOffset;
    uniform float uShadowStrength;

    uniform sampler2D uStoneTexture;
    uniform sampler2D uGroundTexture;
    uniform sampler2D uWaterTexture;
    uniform sampler2D uCloudTexture;
    uniform sampler2D uNightCloudTexture;
    uniform sampler2D uBuildingTexture;
    uniform sampler2D uGrassImageTexture;

    uniform float uTexScale;
    uniform float uWaterTime;
    uniform vec4 uSkyTop;
    uniform vec4 uSkyBottom;

    vec4 sampleTriplanar(sampler2D tex, vec3 pos, vec3 normal, float scale) {

        vec3 blend = abs(normal);
        blend = pow(blend, vec3(7.0));
        blend = max(blend, vec3(0.0001));
        blend /= blend.x + blend.y + blend.z;

        vec2 uvX = pos.yz * scale;
        vec2 uvY = pos.xz * scale;
        vec2 uvZ = pos.xy * scale;

        vec4 xTex = texture(tex, uvX);
        vec4 yTex = texture(tex, uvY);
        vec4 zTex = texture(tex, uvZ);

        return xTex * blend.x + yTex * blend.y + zTex * blend.z;
    }

    float luminance(vec3 c) {
        return dot(c, vec3(0.299, 0.587, 0.114));
    }

    vec3 fakeBumpNormal(vec3 baseNormal, vec3 pos, sampler2D tex, float scale, float strength) {
        float e = 0.015;

        float h  = luminance(sampleTriplanar(tex, pos, baseNormal, scale).rgb);
        float hx = luminance(sampleTriplanar(tex, pos + vec3(e, 0.0, 0.0), baseNormal, scale).rgb);
        float hz = luminance(sampleTriplanar(tex, pos + vec3(0.0, 0.0, e), baseNormal, scale).rgb);

        vec3 bump = vec3((h - hx) * strength, 0.0, (h - hz) * strength);
        return normalize(baseNormal + bump);
    }

    vec3 getWaterBase(vec2 uv) {
        vec2 waveUV1 = uv * vec2(7.0, 26.0) + vec2(uWaterTime * 0.018, uWaterTime * 0.035);
        vec2 waveUV2 = uv * vec2(15.0, 42.0) - vec2(uWaterTime * 0.012, uWaterTime * 0.020);

        vec3 waveA = texture(uWaterTexture, waveUV1).rgb;
        vec3 waveB = texture(uWaterTexture, waveUV2).rgb;

        float waves = mix(waveA.g, waveB.b, 0.45);

        vec3 deepWater = vec3(0.020, 0.080, 0.110);
        vec3 blueWater = vec3(0.080, 0.260, 0.340);
        vec3 skyWater = mix(blueWater, uSkyBottom.rgb, 0.18);

        vec3 water = mix(deepWater, skyWater, 0.65);  
        water += waves * vec3(0.045, 0.095, 0.120); 
        return clamp(water, 0.0, 1.0);
    }
    vec3 getSkyColor() {
        float horizon = smoothstep(-2.15, 8.0, vObjPos.y);

        vec3 sky = mix(uSkyBottom.rgb, uSkyTop.rgb, horizon);

        vec2 uv = vTexCoord;

        vec2 cloudUV = uv + vec2(uWaterTime * 0.002, 0.0);

        vec2 rotatedUV = vec2(cloudUV.y, 1.0 - cloudUV.x);

        vec3 dayCloudTex = texture(uCloudTexture, rotatedUV).rgb;
        vec3 nightCloudTex = texture(uNightCloudTexture, rotatedUV).rgb;

        float skyBrightness = dot(uSkyTop.rgb, vec3(0.333));

        float dayFactor = smoothstep(0.08, 0.45, skyBrightness);

        vec3 cloudTex = mix(nightCloudTex, dayCloudTex, dayFactor);

        if (dayFactor < 0.2) {
            cloudTex *= 1.4;
        }
        float cloudLuma = dot(cloudTex, vec3(0.333));
        float cloudMask = smoothstep(0.42, 0.86, cloudLuma) * 0.34;

        vec3 dayCloud = vec3(0.96, 0.97, 0.96);
        vec3 sunsetCloud = vec3(1.0, 0.70, 0.48);
        vec3 nightCloud = vec3(0.16, 0.19, 0.30);

        vec3 cloudColor = mix(nightCloud, dayCloud, smoothstep(0.12, 0.55, skyBrightness));
        cloudColor = mix(cloudColor, sunsetCloud, smoothstep(0.45, 0.75, uSkyBottom.r - uSkyBottom.b));

        sky = mix(sky, cloudColor, cloudMask);
        sky += cloudMask * 0.05;

        return clamp(sky, 0.0, 1.0);
    }
    vec3 getBaseColor() {
        if (vMaterial < 0.5) {
            float noise = fract(sin(dot(vObjPos.xy ,vec2(12.9898,78.233))) * 43758.5453);

            vec3 stone = sampleTriplanar(uStoneTexture, vObjPos + noise * 0.4, normalize(vObjNormal), uTexScale * 1.25).rgb;

            stone = pow(stone, vec3(0.82)); 
            float vein = smoothstep(0.45, 0.85, stone.b);

            return mix(vec3(0.70, 0.68, 0.62), stone, 0.92) + vein * 0.08;
        }

        if (vMaterial < 1.5) {
            vec2 uv = vTexCoord;

            vec3 grassBase = texture(uGroundTexture, uv * 10.0).rgb;
            vec3 grassDetail = texture(uGroundTexture, uv * 45.0).rgb;
            vec3 grass = mix(grassBase, grassDetail, 0.48);
            vec2 realGrassUV = vTexCoord * 3.0;
            vec3 realGrass = texture(uGrassImageTexture, realGrassUV).rgb;

            grass = mix(grass, realGrass, 0.32);
            float variation = sin(uv.x * 38.0) * sin(uv.y * 31.0);
            grass *= 0.82 + 0.18 * variation;

            vec3 darkRoot = vec3(0.08, 0.16, 0.055);
            vec3 freshTip = vec3(0.34, 0.52, 0.16);

            grass = mix(darkRoot, grass, 0.72);
            grass = mix(grass, freshTip, 0.18);

            float sideDarken = smoothstep(4.0, 24.0, abs(vObjPos.x));
            float farDarken = smoothstep(8.0, 32.0, abs(vObjPos.z));

            grass *= mix(1.0, 0.62, sideDarken * 0.55);
            grass *= mix(1.0, 0.72, farDarken * 0.35);

            float centerFocus = 1.0 - smoothstep(0.0, 10.0, abs(vObjPos.x));
            grass *= 0.92 + centerFocus * 0.10;

            return clamp(grass, 0.0, 1.0);
        }

        if (vMaterial < 2.5) {
            return getWaterBase(vTexCoord);
        }

        if (vMaterial > 4.5 && vMaterial < 5.5) {
            return getSkyColor();
        }

        if (vMaterial > 2.5 && vMaterial < 3.5) {
            vec3 waterBase = getWaterBase(vTexCoord);

            float stretchedY = clamp(vTexCoord.y / uReflectionLength, 0.0, 1.0);
            float fade = pow(1.0 - stretchedY, 1.2);

            vec2 movingReflectionUV = vTexCoord;
            movingReflectionUV.x += uShadowOffset.x * 0.10;
            movingReflectionUV.y += uShadowOffset.y * 0.08;

            float verticalColumns =
                smoothstep(0.72, 0.96,
                    abs(sin(movingReflectionUV.x * 3.14159 * 13.0))
                );

            float horizontalRipple =
                0.5 + 0.5 * sin(movingReflectionUV.y * 55.0 + uWaterTime * 0.55);

            float softBreak =
                0.75 + 0.25 * sin(movingReflectionUV.x * 18.0 + movingReflectionUV.y * 25.0);

            vec3 reflectionStone = vec3(0.95, 0.82, 0.58);  
            vec3 reflectionDark = vec3(0.22, 0.16, 0.10);  

            vec3 reflectionColor = mix(reflectionDark, reflectionStone, verticalColumns);
            reflectionColor *= mix(0.82, 1.18, horizontalRipple) * softBreak;

            reflectionColor = mix(reflectionColor, vec3(1.0, 0.72, 0.38), 0.28);

            vec3 reflectedWater = mix(waterBase, reflectionColor, fade * uReflectionOpacity * 0.85);

            float waterShadowShape = verticalColumns * fade;
            vec3 waterShadowColor = vec3(0.015, 0.025, 0.030);

            reflectedWater = mix(
                reflectedWater,
                waterShadowColor,
                waterShadowShape * uReflectionOpacity * 0.38
            );

            return reflectedWater;
        }

        if (vMaterial > 3.5 && vMaterial < 4.5) {
            vec2 p = vObjPos.xz;
            p -= vec2(0.0, -0.4);
            p += uShadowOffset * 1.8;

            float x = p.x;
            float z = p.y;

            float bodyX = smoothstep(-3.8, -3.1, x) * (1.0 - smoothstep(3.1, 3.8, x));
            float bodyZ = smoothstep(-2.8, -2.1, z) * (1.0 - smoothstep(2.6, 3.4, z));
            float body = bodyX * bodyZ;

            float stepsX = smoothstep(-3.4, -2.7, x) * (1.0 - smoothstep(2.7, 3.4, x));
            float stepsZ = smoothstep(-3.7, -3.0, z) * (1.0 - smoothstep(-1.3, -0.6, z));
            float steps = stepsX * stepsZ * 0.55;

            float columns = 0.0;
            for (int i = 0; i < 9; i++) {
                float cx = -2.8 + float(i) * 0.70;
                float col = 1.0 - smoothstep(0.05, 0.16, abs(x - cx));
                float colZ = smoothstep(-2.1, -1.7, z) * (1.0 - smoothstep(1.6, 2.2, z));
                columns += col * colZ;
            }

            columns = clamp(columns, 0.0, 1.0) * 0.65;

            float shadowShape = max(max(body, steps), columns);

            float distanceFade = smoothstep(4.8, 0.4, length(p));
            float edgeSoftness = smoothstep(0.04, 0.90, shadowShape);

            shadowShape = edgeSoftness * mix(0.45, 1.0, distanceFade);

            vec3 groundUnder = texture(uGroundTexture, vTexCoord * 0.5).rgb;
            groundUnder = mix(vec3(0.18, 0.24, 0.13), groundUnder, 0.75);

            vec3 shadowColor = mix(
                vec3(0.055, 0.070, 0.045),
                vec3(0.012, 0.016, 0.014),
                distanceFade
            );

            return mix(
                groundUnder,
                shadowColor,
                shadowShape * uShadowStrength
            );
        }
        if (vMaterial > 5.5 && vMaterial < 6.5) {

            vec3 tex = texture(uBuildingTexture, vTexCoord).rgb;

            vec3 cityTint = mix(vec3(0.22, 0.26, 0.32), tex, 0.82);

            float skyBrightness = dot(uSkyTop.rgb, vec3(0.333));

            float nightAmount = 1.0 - smoothstep(0.12, 0.45, skyBrightness);

            cityTint *= mix(1.0, 0.38, nightAmount);

            float windowMask = smoothstep(0.55, 0.9, tex.r);
            vec3 windowGlow = vec3(1.0, 0.82, 0.48) * nightAmount * 0.55;

            cityTint += windowGlow * windowMask;

            return clamp(cityTint, 0.0, 1.0);
        }
        
        return getSkyColor();
    }

    void main() {
        vec3 base = getBaseColor();
        vec3 N = normalize(vEyeNormal);

        if (vMaterial < 0.5) {
            N = fakeBumpNormal(N, vObjPos, uStoneTexture, uTexScale * 1.35, 1.75);
        }
        else if (vMaterial < 1.5) {
            N = fakeBumpNormal(N, vec3(vTexCoord.x, 0.0, vTexCoord.y), uGroundTexture, 18.0, 1.6);
        }
        else if (vMaterial < 2.5 || (vMaterial > 2.5 && vMaterial < 3.5)) {
            float r1 = texture(uWaterTexture, vTexCoord * vec2(4.0, 12.0) + uWaterTime * 0.015).r - 0.5;
            float r2 = texture(uWaterTexture, vTexCoord * vec2(6.0, 16.0) - uWaterTime * 0.010).g - 0.5;

            N = normalize(N + vec3(r1 * 0.10, 0.0, r2 * 0.08));
        }

        vec3 L;
        if (uLightPosition.w == 0.0)
            L = normalize(uLightPosition.xyz);
        else
            L = normalize(uLightPosition.xyz - vEyePos);

        vec3 E = normalize(-vEyePos);
        vec3 H = normalize(L + E);

        float Kd = max(dot(L, N), 0.0);
        float Ks = pow(max(dot(N, H), 0.0), uShininess);

        if (dot(L, N) < 0.0) {
            Ks = 0.0;
        }

        float ao = 0.72 + 0.28 * max(N.y, 0.0);
        if (vMaterial > 6.5 && vMaterial < 8.5) {
            ao *= 0.65;
        }
        if (vMaterial < 0.5) {
            ao *= 0.85;   
        }
        float diffuseBoost = 1.35;
        float specBoost = 1.0;

        if (vMaterial < 0.5) {
            specBoost = 0.65;
        }
        else if (vMaterial < 1.5) {
            specBoost = 0.25;
        }
        else if (vMaterial < 2.5 || (vMaterial > 2.5 && vMaterial < 3.5)) {
            diffuseBoost = 0.75;
            specBoost = 5.5;
            base = mix(base, uSkyBottom.rgb, 0.04);
        }

        vec3 lightTint = normalize(uDiffuseProduct.rgb + vec3(0.001));
        vec3 skyTint = normalize(uSkyBottom.rgb + vec3(0.001));

        vec3 materialColor = base;

        if (vMaterial < 0.5) {
            materialColor = mix(base, base * lightTint, 0.14);
            materialColor = mix(materialColor, vec3(0.86, 0.82, 0.74), 0.10);
        }

        else if (vMaterial < 1.5) {
            float groundLight = clamp(Kd, 0.0, 1.0);

            vec3 warmSun = vec3(1.08, 0.92, 0.72);
            vec3 coolSky = vec3(0.62, 0.72, 0.95);

            vec3 timeTint = mix(coolSky, warmSun, groundLight);

            materialColor = mix(base, base * lightTint, 0.34);
            materialColor = mix(materialColor, base * skyTint, 0.24);
            materialColor = mix(materialColor, materialColor * timeTint, 0.28);

            materialColor = mix(materialColor, vec3(0.18, 0.26, 0.12), 0.08);
        }

        else if (vMaterial < 2.5 || (vMaterial > 2.5 && vMaterial < 3.5)) {
            materialColor = mix(base, uSkyBottom.rgb, 0.10);
            materialColor = mix(materialColor, uDiffuseProduct.rgb, 0.06);
        }

        float shadowBoost = 1.0;

        if (vMaterial < 0.5) {
            shadowBoost = pow(Kd, 1.85);
        } else {
            shadowBoost = Kd;
        }
        vec3 ambient = uAmbientProduct.rgb * materialColor * ao;
        vec3 diffuse = shadowBoost * uDiffuseProduct.rgb * materialColor * diffuseBoost;

        float rim = pow(1.0 - max(dot(normalize(vEyeNormal), E), 0.0), 2.0);
        vec3 rimColor = uSkyBottom.rgb * rim * 0.18;

        vec3 specular = Ks * uSpecularProduct.rgb * specBoost;
        if (vMaterial > 0.5 && vMaterial < 1.5) {
            float grassSheen = pow(1.0 - max(dot(N, E), 0.0), 2.0);
            specular += uSkyBottom.rgb * grassSheen * 0.10;
        }
        if (vMaterial > 1.5 && vMaterial < 3.5) {
            float glint = pow(max(dot(N, H), 0.0), 55.0);
            float longHighlight = pow(max(dot(N, H), 0.0), 18.0) * 0.18;

            specular += (glint + longHighlight) * uWaterHighlightColor.rgb * uWaterHighlight * 1.45;
        }

        if (vMaterial < 0.5) {
            float stoneEdge = pow(1.0 - max(dot(normalize(vEyeNormal), E), 0.0), 2.5);
            rimColor += vec3(0.65, 0.68, 0.72) * stoneEdge * 0.035;

            float interiorMask = smoothstep(0.15, 0.55, abs(vObjPos.x));
            if (vObjPos.y < 0.6 && vObjPos.z > -1.7 && vObjPos.z < 1.9) {
                materialColor *= mix(0.35, 1.0, interiorMask);
                specular *= 0.35;
            }
        }
        vec3 color = ambient + diffuse + specular + rimColor;

        color = color / (color + vec3(0.85));  
        color = pow(color, vec3(0.72));     

        color = (color - vec3(0.5)) * 1.35 + vec3(0.5);

        color = max(color, vec3(0.035));

        color = clamp(color, 0.0, 1.0);

        fColor = vec4(color, 1.0);
    }
    </script>

    <script src="../Common/initShaders.js"></script>
    <script src="../Common/MVnew.js"></script>
    <script src="lincoln_daynight.js"></script>
</body>
</html>
